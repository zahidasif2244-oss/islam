const PER_PAGE = 100;
let page = 0;
const grid = document.getElementById('grid');
const info = document.getElementById('pageInfo');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function render() {
    const q = searchInput.value.trim().toLowerCase();
    const filtered = q ? cards.filter(c => c.includes(q) || c.toLowerCase().includes(q)) : cards;
    if (filtered.length === 0) {
        grid.innerHTML = '<div class="no-results">کوئی کتاب نہیں ملی</div>';
        info.textContent = '0 / 0';
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
    }
    if (page >= Math.ceil(filtered.length / PER_PAGE)) page = 0;
    const start = page * PER_PAGE;
    const end = Math.min(start + PER_PAGE, filtered.length);
    grid.innerHTML = filtered.slice(start, end).join('');
    const totalPages = Math.ceil(filtered.length / PER_PAGE);
    info.textContent = (page + 1) + ' / ' + totalPages;
    prevBtn.disabled = page === 0;
    nextBtn.disabled = end >= filtered.length;
}
const searchInput = document.getElementById('searchInput');
searchInput.addEventListener('input', () => { page = 0; render(); });
grid.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (btn && btn.dataset.url) {
        window.location.href = btn.dataset.url;
    }
});
grid.addEventListener('auxclick', (e) => {
    const btn = e.target.closest('.btn');
    if (btn && btn.dataset.url && e.button === 1) {
        e.preventDefault();
        window.open(btn.dataset.url, '_blank');
    }
});
document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('keydown', (e) => {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'S'].includes(e.key.toUpperCase())) || (e.ctrlKey && e.key.toUpperCase() === 'U')) {
        e.preventDefault();
    }
});
prevBtn.addEventListener('click', () => { if (page > 0) { page--; render(); window.scrollTo(0, 0); } });
nextBtn.addEventListener('click', () => { if ((page + 1) * PER_PAGE < cards.length) { page++; render(); window.scrollTo(0, 0); } });
render();
</script>
