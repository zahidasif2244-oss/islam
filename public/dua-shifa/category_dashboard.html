<!DOCTYPE html>
<html dir="rtl" lang="ur">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>زمرہ جات ڈیش بورڈ - دعا اور شفا</title>
    <link rel="icon" href="icon.png"/>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                primary: '#13b6ec',
                'primary-dark': '#0ea5d6',
                'background-light': '#f6f8f8',
                'background-dark': '#101d22',
                'surface-light': '#ffffff',
                'surface-dark': '#1a2c33',
                'text-main-light': '#111618',
                'text-main-dark': '#e2e8f0',
                'text-sub-light': '#617f89',
                'text-sub-dark': '#94a3b8',
                'border-light': '#f0f3f4',
                'border-dark': '#2d3f47',
            },
            fontFamily: {
                display: ['UrduFont', 'Noto Nastaliq Urdu', 'serif'],
                urdu: ['UrduFont', 'Noto Nastaliq Urdu', 'serif'],
                arabic: ['ArabicFont', 'Noto Naskh Arabic', 'serif']
            },
            fontSize: {
                'urdu': ['1.35rem', { lineHeight: '2.6' }],
                'urdu-lg': ['1.55rem', { lineHeight: '2.8' }],
                'urdu-xl': ['1.75rem', { lineHeight: '3' }],
            }
        }
    }
}
</script>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body class="bg-background-light dark:bg-background-dark text-text-main-light dark:text-text-main-dark font-urdu antialiased min-h-screen flex flex-col transition-colors duration-200">
    
    <!-- Header -->
    <header class="sticky top-0 z-50 w-full bg-surface-light/95 dark:bg-surface-dark/95 backdrop-blur border-b border-border-light dark:border-border-dark px-6 py-4">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <a href="home.html" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                <img src="icon.png" alt="دعا اور شفا" class="w-10 h-10 rounded-lg shrink-0" onerror="this.style.display='none'"/>
                <h2 class="text-xl font-bold tracking-tight text-text-main-light dark:text-text-main-dark whitespace-nowrap">دعا اور شفا</h2>
            </a>
            <div class="hidden lg:flex flex-1 max-w-md mx-6 relative">
                <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-text-sub-light dark:text-text-sub-dark">
                    <span class="material-symbols-outlined">search</span>
                </span>
                <input class="w-full pr-10 pl-4 py-2 rounded-full bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark text-text-main-light dark:text-text-main-dark focus:ring-2 focus:ring-primary focus:border-primary outline-none text-sm transition-all" placeholder="تلاش کریں..." type="text"/>
            </div>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-text-sub-light dark:text-text-sub-dark whitespace-nowrap">
                <a class="hover:text-primary transition-colors" href="home.html">ہوم</a>
                <a class="hover:text-primary transition-colors" href="post_dashboard.html">پوسٹس</a>
                <a class="hover:text-primary transition-colors text-primary" href="category_dashboard.html">زمرہ جات</a>
                <a class="hover:text-primary transition-colors" href="create_post.html">نئی پوسٹ</a>
            </nav>
            <div class="flex items-center gap-2">
                <button aria-label="Toggle Dark Mode" class="flex items-center justify-center w-10 h-10 rounded-full bg-background-light dark:bg-background-dark hover:bg-border-light dark:hover:bg-border-dark transition-colors text-text-main-light dark:text-text-main-dark shrink-0" id="darkModeToggle">
                    <span class="material-symbols-outlined">light_mode</span>
                </button>
                <button onclick="Auth.logout()" id="authButton" class="flex items-center gap-2 rounded-full bg-red-500 hover:bg-red-600 text-white px-4 py-2 text-sm font-bold shadow-sm transition-all shrink-0" title="لاگ آؤٹ">
                    <span class="material-symbols-outlined text-lg">logout</span>
                    <span class="hidden sm:inline">لاگ آؤٹ</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-7xl mx-auto px-6 py-8">
        <div class="flex flex-col md:flex-row md:items-end justify-between mb-8 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold text-text-main-light dark:text-text-main-dark tracking-tight">زمرہ جات کا انتظام</h1>
                <p class="text-text-sub-light dark:text-text-sub-dark text-lg mt-2">مواد کے زمرہ جات کا انتظام اور تنظیم کریں</p>
            </div>
            <button onclick="openCreateModal()" class="group flex items-center justify-center gap-2 rounded-lg bg-primary px-5 py-2.5 text-sm font-bold text-white shadow-sm transition-all hover:bg-primary-dark hover:shadow-md">
                <span class="material-symbols-outlined text-lg">add</span>
                <span>نیا زمرہ</span>
            </button>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3 mb-8">
            <div class="flex flex-col gap-1 rounded-xl border border-border-light bg-surface-light p-5 shadow-sm dark:border-border-dark dark:bg-surface-dark">
                <div class="mb-2 flex size-10 items-center justify-center rounded-lg bg-primary/10 text-primary">
                    <span class="material-symbols-outlined">category</span>
                </div>
                <p class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark">کل زمرہ جات</p>
                <p class="text-2xl font-bold text-text-main-light dark:text-text-main-dark" id="totalCategories">0</p>
            </div>
            <div class="flex flex-col gap-1 rounded-xl border border-border-light bg-surface-light p-5 shadow-sm dark:border-border-dark dark:bg-surface-dark">
                <div class="mb-2 flex size-10 items-center justify-center rounded-lg bg-green-500/10 text-green-600">
                    <span class="material-symbols-outlined">check_circle</span>
                </div>
                <p class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark">فعال</p>
                <p class="text-2xl font-bold text-text-main-light dark:text-text-main-dark" id="activeCategories">0</p>
            </div>
            <div class="flex flex-col gap-1 rounded-xl border border-border-light bg-surface-light p-5 shadow-sm dark:border-border-dark dark:bg-surface-dark">
                <div class="mb-2 flex size-10 items-center justify-center rounded-lg bg-orange-500/10 text-orange-600">
                    <span class="material-symbols-outlined">archive</span>
                </div>
                <p class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark">محفوظ</p>
                <p class="text-2xl font-bold text-text-main-light dark:text-text-main-dark" id="archivedCategories">0</p>
            </div>
        </div>

        <!-- Categories Table -->
        <div class="flex flex-col rounded-xl border border-border-light bg-surface-light shadow-sm dark:border-border-dark dark:bg-surface-dark">
            <!-- Toolbar -->
            <div class="flex flex-wrap items-center justify-between gap-4 border-b border-border-light p-4 dark:border-border-dark">
                <div class="relative w-full sm:w-72">
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-3 text-text-sub-light dark:text-text-sub-dark">
                        <span class="material-symbols-outlined text-[20px]">search</span>
                    </div>
                    <input id="searchInput" class="block w-full rounded-lg border-0 bg-background-light py-2.5 pr-10 pl-4 text-sm text-text-main ring-1 ring-inset ring-transparent placeholder:text-text-sub-light focus:ring-2 focus:ring-inset focus:ring-primary dark:bg-background-dark dark:text-white dark:placeholder:text-text-sub-dark" placeholder="زمرہ جات تلاش کریں..." type="text"/>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="DataExport.exportCategories()" class="flex items-center gap-2 rounded-lg border border-green-300 bg-green-50 px-3 py-2 text-sm font-medium text-green-700 hover:bg-green-100 dark:border-green-700 dark:bg-green-900/20 dark:text-green-400 dark:hover:bg-green-900/30">
                        <span class="material-symbols-outlined text-[18px]">download</span>
                        ایکسپورٹ JSON
                    </button>
                    <button onclick="DataImport.importCategories()" class="flex items-center gap-2 rounded-lg border border-blue-300 bg-blue-50 px-3 py-2 text-sm font-medium text-blue-700 hover:bg-blue-100 dark:border-blue-700 dark:bg-blue-900/20 dark:text-blue-400 dark:hover:bg-blue-900/30">
                        <span class="material-symbols-outlined text-[18px]">upload</span>
                        امپورٹ JSON
                    </button>
                    <button onclick="loadCategories()" class="flex items-center gap-2 rounded-lg border border-border-light bg-surface-light px-3 py-2 text-sm font-medium text-text-sub-light hover:bg-background-light dark:border-border-dark dark:bg-surface-dark dark:text-text-sub-dark dark:hover:bg-background-dark">
                        <span class="material-symbols-outlined text-[18px]">refresh</span>
                        تازہ کریں
                    </button>
                </div>
            </div>
            
            <!-- Table -->
            <div class="overflow-x-auto">
                <table class="w-full min-w-[800px] text-left text-sm">
                    <thead class="bg-background-light text-text-sub-light dark:bg-background-dark dark:text-text-sub-dark">
                        <tr>
                            <th class="px-6 py-4 font-semibold" scope="col">زمرہ کا نام</th>
                            <th class="px-6 py-4 font-semibold" scope="col">تفصیل</th>
                            <th class="px-6 py-4 font-semibold" scope="col">آئٹمز</th>
                            <th class="px-6 py-4 font-semibold" scope="col">حالت</th>
                            <th class="px-6 py-4 text-right font-semibold" scope="col">عمل</th>
                        </tr>
                    </thead>
                    <tbody id="categoriesTableBody" class="divide-y divide-border-light dark:divide-border-dark text-text-main-light dark:text-text-main-dark">
                        <!-- Categories will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-col items-center justify-center py-12">
                <span class="material-symbols-outlined text-6xl text-text-sub-light dark:text-text-sub-dark mb-4">category</span>
                <p class="text-text-sub-light dark:text-text-sub-dark">کوئی زمرہ نہیں ملا</p>
            </div>
        </div>
    </main>

    <!-- Create/Edit Modal -->
    <div id="categoryModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/50 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg">
            <div class="bg-surface-light dark:bg-surface-dark rounded-xl shadow-xl border border-border-light dark:border-border-dark p-6">
                <div class="flex items-center justify-between mb-6">
                    <h3 id="modalTitle" class="text-xl font-bold text-text-main-light dark:text-text-main-dark">نیا زمرہ</h3>
                    <button onclick="closeModal()" class="text-text-sub-light dark:text-text-sub-dark hover:text-primary">
                        <span class="material-symbols-outlined">close</span>
                    </button>
                </div>
                <form id="categoryForm" class="flex flex-col gap-4">
                    <input type="hidden" id="categoryId">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-text-main-light dark:text-text-main-dark">زمرہ کا نام *</label>
                        <input id="categoryName" required class="rounded-lg border-border-light bg-background-light px-4 py-2.5 text-sm text-text-main focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-background-dark dark:text-white" placeholder="مثلاً قرآن، حدیث، دعائیں" type="text"/>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-text-main-light dark:text-text-main-dark">تفصیل</label>
                        <textarea id="categoryDescription" rows="3" class="rounded-lg border-border-light bg-background-light px-4 py-2.5 text-sm text-text-main focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-background-dark dark:text-white" placeholder="زمرہ کی مختصر تفصیل..."></textarea>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-text-main-light dark:text-text-main-dark">حالت</label>
                        <select id="categoryStatus" class="rounded-lg border-border-light bg-background-light px-4 py-2.5 text-sm text-text-main focus:border-primary focus:ring-primary dark:border-border-dark dark:bg-background-dark dark:text-white">
                            <option value="active">فعال</option>
                            <option value="archived">محفوظ</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-3 pt-4 border-t border-border-light dark:border-border-dark">
                        <button type="button" onclick="closeModal()" class="rounded-lg px-4 py-2 text-sm font-medium text-text-sub-light hover:bg-background-light dark:text-text-sub-dark dark:hover:bg-background-dark">منسوخ</button>
                        <button type="submit" class="rounded-lg bg-primary px-6 py-2 text-sm font-bold text-white hover:bg-primary-dark">محفوظ کریں</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-surface-light dark:bg-surface-dark border-t border-border-light dark:border-border-dark mt-auto">
        <div class="max-w-7xl mx-auto px-6 py-8">
            <div class="text-center text-sm text-text-sub-light dark:text-text-sub-dark">
                <p>© 2024 دعا اور شفا۔ جملہ حقوق محفوظ ہیں</p>
            </div>
        </div>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="app.js"></script>
    <script>
        // Initialize theme
        document.addEventListener('DOMContentLoaded', function() {
            Theme.init();
        });

        // Page-specific category management code
        async function loadCategories() {
            const { data: categories, error } = await Categories.getAll();

            if (error) {
                console.error('Error loading categories:', error);
                return;
            }

            const tbody = document.getElementById('categoriesTableBody');
            const emptyState = document.getElementById('emptyState');
            
            // Update stats
            document.getElementById('totalCategories').textContent = categories?.length || 0;
            document.getElementById('activeCategories').textContent = categories?.filter(c => c.status === 'active').length || 0;
            document.getElementById('archivedCategories').textContent = categories?.filter(c => c.status === 'archived').length || 0;

            if (!categories || categories.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');

            tbody.innerHTML = categories.map(cat => `
                <tr class="group hover:bg-background-light/50 dark:hover:bg-background-dark/50">
                    <td class="px-6 py-4">
                        <div class="flex items-center gap-3">
                            <div class="flex size-10 shrink-0 items-center justify-center rounded-lg bg-primary/10 text-primary">
                                <span class="material-symbols-outlined">folder</span>
                            </div>
                            <div class="font-medium text-text-main-light dark:text-white">${cat.name}</div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-text-sub-light dark:text-text-sub-dark">${cat.description || '-'}</td>
                    <td class="px-6 py-4 text-text-sub-light dark:text-text-sub-dark">${cat.item_count || 0}</td>
                    <td class="px-6 py-4">
                        <span class="inline-flex items-center rounded-full ${cat.status === 'active' ? 'bg-green-50 text-green-700 dark:bg-green-900/20 dark:text-green-400' : 'bg-slate-50 text-slate-600 dark:bg-slate-400/10 dark:text-slate-400'} px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset ${cat.status === 'active' ? 'ring-green-600/20' : 'ring-slate-500/10'}">
                            ${cat.status === 'active' ? 'فعال' : 'محفوظ'}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-right">
                        <div class="flex items-center justify-end gap-2 opacity-0 transition-opacity group-hover:opacity-100">
                            <button onclick="editCategory('${cat.id}', '${cat.name}', '${cat.description || ''}', '${cat.status}')" class="rounded-lg p-2 text-text-sub-light hover:bg-background-light hover:text-primary dark:text-text-sub-dark dark:hover:bg-background-dark">
                                <span class="material-symbols-outlined text-[20px]">edit</span>
                            </button>
                            <button onclick="deleteCategory('${cat.id}')" class="rounded-lg p-2 text-text-sub-light hover:bg-red-50 hover:text-red-600 dark:text-text-sub-dark dark:hover:bg-red-900/20 dark:hover:text-red-400">
                                <span class="material-symbols-outlined text-[20px]">delete</span>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        // Modal functions
        function openCreateModal() {
            document.getElementById('modalTitle').textContent = 'نیا زمرہ';
            document.getElementById('categoryId').value = '';
            document.getElementById('categoryName').value = '';
            document.getElementById('categoryDescription').value = '';
            document.getElementById('categoryStatus').value = 'active';
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function editCategory(id, name, description, status) {
            document.getElementById('modalTitle').textContent = 'زمرہ ترمیم';
            document.getElementById('categoryId').value = id;
            document.getElementById('categoryName').value = name;
            document.getElementById('categoryDescription').value = description;
            document.getElementById('categoryStatus').value = status;
            document.getElementById('categoryModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('categoryModal').classList.add('hidden');
        }

        // Form submit
        document.getElementById('categoryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = 'انتظار کریں...';
            
            try {
                // Wait for backend
                await waitForBackend();
                
                const id = document.getElementById('categoryId').value;
                const name = document.getElementById('categoryName').value;
                const description = document.getElementById('categoryDescription').value;
                const status = document.getElementById('categoryStatus').value;
                
                const categoryData = { name, description, status };
                
                let result;
                if (id) {
                    result = await Categories.update(id, categoryData);
                } else {
                    result = await Categories.create(categoryData);
                }

                if (result.error) {
                    alert('خرابی: ' + result.error.message);
                } else {
                    alert('کامیاب! زمرہ بن گیا');
                    closeModal();
                    loadCategories();
                }
            } catch (err) {
                alert('خرابی: ' + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = id ? 'تازہ کریں' : 'بنائیں';
            }
        });

        // Delete category
        async function deleteCategory(id) {
            if (!confirm('کیا آپ واقعی اس زمرہ کو حذف کرنا چاہتے ہیں؟')) return;
            
            const { error } = await Categories.delete(id);
            
            if (error) alert('خرابی: ' + error.message);
            else loadCategories();
        }

        // Initialize
        Auth.requireAuth();
        loadCategories();
        Search.filterTable('searchInput', 'categoriesTableBody');
    </script>
</body>
</html>
